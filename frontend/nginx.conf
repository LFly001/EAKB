# ============================================================
# EAKB 前端容器 Nginx 配置 (Phase 8)
# 静态资源托管 + /api/ 反向代理到后端容器
# SSE 透传关键配置: proxy_buffering off / proxy_cache off /
#   长超时 / 不缓存 X-Accel, 否则 chat-stream 流式输出会被缓冲挂起
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存 (带 hash 的构建产物可长缓存)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 后端 API 反向代理 (含 SSE 流式透传) ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键: 关闭缓冲与缓存, 透传长连接, 避免流挂起
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- SPA 前端路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
