# ============================================================
# EAKB 宿主 Nginx 反向代理配置 (Phase 8, 裸机部署路径)
# 安装位置: /etc/nginx/sites-available/eakb.conf
#           sudo ln -s /etc/nginx/sites-available/eakb.conf /etc/nginx/sites-enabled/
# 前提: 前端已构建 (frontend/dist), 后端 uvicorn 监听 127.0.0.1:8000
# SSE 透传关键: proxy_buffering off + 长超时 (同 vite dev 代理思路)
# ============================================================
server {
    listen 80;
    server_name 192.168.1.80;   # 按实际服务器 IP / 域名修改

    # ---- 前端静态资源 (npm run build 产物) ----
    root /home/kun/eakb/frontend/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 后端 API 反向代理 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键: 关闭缓冲, 长超时 — 否则 /api/v1/rag/chat-stream 流式挂起
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 健康检查透传 (可选) ----
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # ---- SPA 前端路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 上传大小限制 (默认 50MB, 与 UPLOAD_MAX_SIZE_MB 保持一致)
    client_max_body_size 50m;
}
