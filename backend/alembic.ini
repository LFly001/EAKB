# ============================================================
# Alembic 数据库迁移配置
# EAKB 企业知识库智能助手
# ============================================================

[alembic]
# 迁移脚本存放目录
script_location = alembic

# 预处理迁移文件 (移除 sqlalchemy.url 硬编码，由 env.py 从 config 读取)
# sqlalchemy.url = driver://user:pass@localhost/dbname

# 日志配置
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 时区
timezone = Asia/Shanghai

# 每次升级前是否截断过长的索引名 (MySQL 单列索引名限制 64 字符)
truncate_slug_length = 40

# 生成迁移时对列类型变更的策略
compare_type = True

# 生成迁移时对服务器默认值的比较
compare_server_default = True

# ============================================================
# 日志 (可选)
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
