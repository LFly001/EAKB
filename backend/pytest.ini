[pytest]
; 测试目录
testpaths = tests
; pytest-asyncio 严格模式: 异步用例必须显式标记 @pytest.mark.asyncio
asyncio_mode = strict
; 默认事件循环作用域 (与现有用例装饰器保持一致)
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
; 过滤第三方库弃用告警噪音 (pydantic/starlette 在 Python 3.14 下的提示)
filterwarnings =
    ignore::DeprecationWarning:pydantic
    ignore::DeprecationWarning:starlette
    ; chromadb 1.5.x 内部使用 asyncio.iscoroutinefunction (Python 3.14 弃用), 第三方噪音
    ignore::DeprecationWarning:chromadb
