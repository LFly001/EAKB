# mypy 配置 — EAKB 后端
# 项目书写约定: 第三方库多无类型 stub (chromadb/neo4j/minio/openpyxl/jose 等),
# 参数默认值使用隐式 Optional (如 http_req: Request = None, 新版 mypy
# 默认改为 no_implicit_optional 导致大量误报), SQLAlchemy 模型 relationship
# 字符串前向引用不在模型文件内 import。

[mypy]
python_version = 3.14
# 第三方库无 stub 的一律放行 (types-* 包不全且额外依赖)
ignore_missing_imports = True
# 恢复隐式 Optional (项目全代码库按此约定书写, 语义清晰: None 即"可选")
implicit_optional = True

# SQLAlchemy 模型: Mapped["Xxx"] 字符串前向引用 (官方推荐写法,
# 跨模型文件不互相 import), name-defined 误报
[mypy-app.models.*]
disable_error_code = name-defined
